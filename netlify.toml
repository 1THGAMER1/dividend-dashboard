[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/oauth/token"
  to = "https://connect.parqet.com/oauth2/token"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://connect.parqet.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
