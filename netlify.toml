[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ─────────────────────────────────────────────────────────────────────────────
# API-Routen → Netlify Functions
# Müssen VOR dem /*-Wildcard stehen, sonst wird alles zu index.html umgeleitet
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/yahoo-dividends"
  to = "/.netlify/functions/yahoo-dividends"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/parqet-proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# HTTP Security Headers
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://connect.parqet.com; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
